<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký Hội thi Tin học trẻ</title>
  <!-- Thư viện tạo mã QR gọn nhẹ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      padding: 30px 35px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 520px;
    }
    h2 {
      text-align: center;
      color: #1a73e8;
      margin-top: 0;
      margin-bottom: 6px;
    }
    p.subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    input[type="text"],
    input[type="tel"],
    input[type="email"],
    select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      border-color: #1a73e8;
    }
    .gender-group {
      display: flex;
      gap: 24px;
      align-items: center;
      margin-top: 6px;
    }
    .gender-label {
      display: flex;
      align-items: center;
      font-weight: normal;
      cursor: pointer;
    }
    .gender-label input {
      margin-right: 6px;
    }
    button {
      width: 100%;
      background: #1a73e8;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background: #1557b0;
    }
    button:disabled {
      background: #9aa0a6;
      cursor: not-allowed;
    }
    #statusMessage {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      display: none;
    }
    .error { color: #d32f2f; }

    /* Giao diện Phiếu Đăng Ký / Thẻ Check-in */
    #ticketContainer {
      display: none;
      margin-top: 20px;
    }
    .ticket-card {
      border: 2px dashed #1a73e8;
      background: #f8fbff;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      position: relative;
    }
    .ticket-header {
      font-size: 18px;
      font-weight: 700;
      color: #1a73e8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .reg-code-badge {
      display: inline-block;
      background: #e8f0fe;
      color: #1a73e8;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: 1px;
      margin: 10px 0;
      border: 1px solid #c2d7fa;
    }
    .ticket-info {
      text-align: left;
      font-size: 14px;
      line-height: 1.8;
      margin: 14px 0;
      background: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    .ticket-info b {
      color: #222;
      display: inline-block;
      width: 90px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin: 15px 0 10px;
    }
    #qrcode img, #qrcode canvas {
      border: 4px solid #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .btn-download {
      background: #2e7d32;
      margin-top: 15px;
    }
    .btn-download:hover {
      background: #1b5e20;
    }
    .btn-re-register {
      background: #fff;
      color: #666;
      border: 1px solid #ccc;
      margin-top: 8px;
    }
    .btn-re-register:hover {
      background: #eee;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- FORM ĐĂNG KÝ -->
    <div id="formWrapper">
      <h2>HỘI THI TIN HỌC TRẺ</h2>
      <p class="subtitle">Phiếu đăng ký thông tin thí sinh</p>

      <form id="registrationForm">
        <div class="form-group">
          <label for="fullname">Họ và tên thí sinh *</label>
          <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required>
        </div>

        <div class="form-group">
          <label>Giới tính *</label>
          <div class="gender-group">
            <label class="gender-label">
              <input type="radio" name="gender" value="Nam" checked> Nam
            </label>
            <label class="gender-label">
              <input type="radio" name="gender" value="Nữ"> Nữ
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Số điện thoại *</label>
          <input type="tel" id="phone" name="phone" placeholder="0901234567" pattern="(0[3|5|7|8|9])+([0-9]{8})\b" title="Số điện thoại di động Việt Nam 10 chữ số" required>
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" placeholder="thi.sinh@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="competition_bracket">Bảng thi *</label>
          <select id="competition_bracket" name="competition_bracket" required>
            <option value="" disabled selected>-- Chọn bảng thi --</option>
            <option value="Bảng A (Tiểu học)">Bảng A - Khối Tiểu học</option>
            <option value="Bảng B (THCS)">Bảng B - Khối THCS</option>
            <option value="Bảng C1 (THPT Chuyên)">Bảng C1 - Khối THPT Chuyên</option>
            <option value="Bảng C2 (THPT Không chuyên)">Bảng C2 - Khối THPT Không chuyên</option>
            <option value="Bảng D2 (Sản phẩm sáng tạo THCS)">Bảng D2 - Sản phẩm sáng tạo THCS</option>
            <option value="Bảng D3 (Sản phẩm sáng tạo THPT)">Bảng D3 - Sản phẩm sáng tạo THPT</option>
          </select>
        </div>

        <button type="submit" id="submitBtn">Gửi Đăng Ký</button>
        <div id="statusMessage"></div>
      </form>
    </div>

    <!-- KHU VỰC TRẢ VỀ PHIẾU CHECK-IN CÓ MÃ QR -->
    <div id="ticketContainer">
      <div class="ticket-card" id="ticketVisual">
        <div class="ticket-header">THẺ CHECK-IN THÍ SINH</div>
        <div>Hội thi Tin học trẻ</div>
        
        <div class="reg-code-badge" id="displayCode">THT-0001</div>
        
        <div id="qrcode"></div>
        <p style="font-size: 12px; color: #777; margin: 4px 0 10px;">(Xuất trình mã QR này tại bàn điểm danh)</p>

        <div class="ticket-info">
          <div><b>Họ tên:</b> <span id="displayName"></span></div>
          <div><b>Giới tính:</b> <span id="displayGender"></span></div>
          <div><b>Điện thoại:</b> <span id="displayPhone"></span></div>
          <div><b>Bảng thi:</b> <span id="displayBracket"></span></div>
        </div>
      </div>

      <button type="button" class="btn-download" id="downloadBtn">Tải ảnh thẻ Check-in (.PNG)</button>
      <button type="button" class="btn-re-register" onclick="location.reload()">Đăng ký thí sinh khác</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5-kdz91lvsziQj6Yu9WGl4FM0HsTG-N6kilxHDqezyDTYBGdVL6aS4IjzhW1PWuIpcw/exec';

    const form = document.getElementById('registrationForm');
    const formWrapper = document.getElementById('formWrapper');
    const ticketContainer = document.getElementById('ticketContainer');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    let currentRegisteredData = null;

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerText = 'Đang xử lý dữ liệu...';
      statusMessage.style.display = 'none';

      const formData = {
        fullname: form.fullname.value.trim(),
        gender: form.gender.value,
        phone: form.phone.value.trim(),
        email: form.email.value.trim(),
        competition_bracket: form.competition_bracket.value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8',
        },
        body: JSON.stringify(formData)
      })
      .then(response => response.json())
      .then(data => {
        if (data.result === 'success') {
          // Dự phòng mã nếu server chưa cập nhật bản deploy mới
          const fallbackCode = 'THT-' + Math.floor(1000 + Math.random() * 9000);
          const finalCode = (data.registrationCode && data.registrationCode !== 'undefined') 
                            ? data.registrationCode 
                            : fallbackCode;

          currentRegisteredData = {
            ...formData,
            code: finalCode
          };
          renderTicket(currentRegisteredData);
        } else {
          throw new Error(data.error || 'Lỗi xử lý');
        }
      })
      .catch(error => {
        console.error('Error:', error);
        statusMessage.className = 'error';
        statusMessage.innerText = 'Có lỗi xảy ra khi gửi đăng ký. Vui lòng thử lại sau!';
        statusMessage.style.display = 'block';
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Gửi Đăng Ký';
      });
    });

    function renderTicket(info) {
      formWrapper.style.display = 'none';
      ticketContainer.style.display = 'block';

      document.getElementById('displayCode').innerText = info.code;
      document.getElementById('displayName').innerText = info.fullname;
      document.getElementById('displayGender').innerText = info.gender;
      document.getElementById('displayPhone').innerText = info.phone;
      document.getElementById('displayBracket').innerText = info.competition_bracket;

      // Xóa QR cũ và tạo QR mới
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      
      try {
        new QRCode(qrContainer, {
          text: String(info.code),
          width: 140,
          height: 140,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      } catch (err) {
        console.error("Lỗi tạo QR:", err);
      }
    }

    // Xử lý tạo và tải ảnh thẻ Check-in
    document.getElementById('downloadBtn').addEventListener('click', function() {
      if (!currentRegisteredData) return;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 600;
      canvas.height = 780;

      // Nền trắng và viền xanh
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#1a73e8";
      ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

      // Tiêu đề
      ctx.fillStyle = "#1a73e8";
      ctx.font = "bold 26px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("THẺ CHECK-IN THÍ SINH", canvas.width / 2, 60);

      ctx.fillStyle = "#555555";
      ctx.font = "18px sans-serif";
      ctx.fillText("Hội thi Tin học trẻ", canvas.width / 2, 95);

      // Khung mã đăng ký
      ctx.fillStyle = "#e8f0fe";
      ctx.fillRect(170, 120, 260, 48);
      ctx.fillStyle = "#1a73e8";
      ctx.font = "bold 24px sans-serif";
      ctx.fillText(currentRegisteredData.code, canvas.width / 2, 153);

      // Khung thông tin cá nhân
      ctx.fillStyle = "#f8fbff";
      ctx.fillRect(40, 420, canvas.width - 80, 270);
      ctx.strokeStyle = "#c2d7fa";
      ctx.lineWidth = 1;
      ctx.strokeRect(40, 420, canvas.width - 80, 270);

      ctx.textAlign = "left";
      ctx.fillStyle = "#222222";
      ctx.font = "18px sans-serif";
      const startX = 65;
      ctx.fillText("Họ và tên:    " + currentRegisteredData.fullname, startX, 465);
      ctx.fillText("Giới tính:    " + currentRegisteredData.gender, startX, 515);
      ctx.fillText("Điện thoại:   " + currentRegisteredData.phone, startX, 565);
      ctx.fillText("Bảng thi:     " + currentRegisteredData.competition_bracket, startX, 615);
      ctx.fillText("Email:        " + currentRegisteredData.email, startX, 665);

      ctx.textAlign = "center";
      ctx.fillStyle = "#888888";
      ctx.font = "italic 15px sans-serif";
      ctx.fillText("(Vui lòng xuất trình thẻ này tại bàn điểm danh)", canvas.width / 2, 730);

      function downloadImage() {
        const link = document.createElement('a');
        link.download = `TheCheckIn_${currentRegisteredData.code}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }

      // Trích xuất QR từ canvas hoặc img sinh bởi qrcodejs
      const qrCanvas = document.querySelector('#qrcode canvas');
      const qrImg = document.querySelector('#qrcode img');

      if (qrCanvas) {
        ctx.drawImage(qrCanvas, (canvas.width - 180) / 2, 195, 180, 180);
        downloadImage();
      } else if (qrImg && qrImg.src) {
        const tempImg = new Image();
        tempImg.onload = function() {
          ctx.drawImage(tempImg, (canvas.width - 180) / 2, 195, 180, 180);
          downloadImage();
        };
        tempImg.src = qrImg.src;
      } else {
        downloadImage();
      }
    });
  </script>
</body>
</html>
